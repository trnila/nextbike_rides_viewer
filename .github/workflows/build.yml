name: build

on:
  workflow_dispatch:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_nextbike_server:
    runs-on: ubuntu-latest
    needs: build_viewer

    steps:
    - uses: actions/checkout@v6

    - run: sudo apt-get install -y gcc-aarch64-linux-gnu
    - run: rustup target add aarch64-unknown-linux-gnu
    - uses: actions/download-artifact@v4
      with:
        name: viewer
        path: viewer/dist/
    - run: cargo build --release --target aarch64-unknown-linux-gnu --verbose
    - uses: actions/upload-artifact@v7
      with:
        name: nextbike_server
        path: target/aarch64-unknown-linux-gnu/release/nextbike

  build_viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org/
    - run: npm ci
    - run: npm run build
    - uses: actions/upload-artifact@v7
      with:
        name: viewer
        path: viewer/dist/

  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: mkdir -p viewer/dist && touch viewer/dist/index.html
      - run: nix develop -c prek run --all-files
